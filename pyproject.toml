[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ultracomplexmath"
version = "0.3.0"
description = "A typed, eight-dimensional commutative algebra combining complex, split-complex and dual numbers"
readme = "README.md"
license = "0BSD"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{name = "Philipp Kolodziej"}]
dependencies = []
keywords = ["mathematics", "hypercomplex", "dual-numbers", "automatic-differentiation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/hoechp/temp"
Issues = "https://github.com/hoechp/temp/issues"
Original = "https://github.com/hoechp/ultracomplexmath"

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.12", "mypy>=1.15", "build>=1", "setuptools>=77", "wheel"]
plot = ["matplotlib>=3.8"]

[project.scripts]
ultracomplex = "ultracomplexmath.__main__:main"
ultracomplex-gui = "ultracomplexmath.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ultracomplexmath = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "E741"]  # I is the conventional imaginary-unit constant.

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
