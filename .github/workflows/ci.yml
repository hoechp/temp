name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    env:
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install -r requirements-plot.lock
      - run: python -m pip install --no-build-isolation -e .
      - run: python -m pytest
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy
      - run: python tools/check_docs.py
      - run: python tools/research_probe.py
      - run: python tools/frontier_probe.py
      - run: python -m build --no-isolation
      - name: Installed wheel smoke test outside source tree
        shell: bash
        run: |
          python -m pip uninstall -y ultracomplexmath
          python -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          python -c 'from ultracomplexmath import I, EPS, ONE; assert I*I == -ONE; assert EPS*EPS == 0*ONE'
          python -m ultracomplexmath 'sqrt(-1)' --json
